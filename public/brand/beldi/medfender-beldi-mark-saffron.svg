<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Medfender — Stratocaster body hung in a riad arch like a Beldi vessel">
  <!--
    MEDFENDER · BELDI MARK v2 (primary)
    Idea: the Stratocaster body hung in a riad arch — mouth-blown glass rims
    (the three single coils), one seed bubble, six strings rising into the
    neck pocket of the doorway.
    Palette: cream field, terracotta arch, brass body, deep-clay bridge.
    Style: flat hand-cut folk print with an offset screenprint shadow.
    Deliberately opposite to the zellige/obsidian identity it replaces.
  -->
  <defs>
    <path id="body" d="M 276.4 168.0 C 288.4 173.4 299.2 199.6 307.7 200.6 C 316.2 201.7 320.9 171.4 327.3 174.5 C 333.6 177.6 341.9 206.6 345.8 219.1 C 349.7 231.6 353.7 238.2 350.7 249.6 C 347.6 261.0 328.6 275.0 327.3 287.7 C 325.9 300.4 338.6 313.5 342.5 325.8 C 346.4 338.0 351.5 348.0 350.7 361.1 C 349.8 374.3 344.8 392.5 337.6 404.6 C 330.4 416.8 321.3 428.1 307.7 434.0 C 294.1 439.9 273.2 440.0 256.0 440.0 C 238.8 440.0 217.9 439.9 204.3 434.0 C 190.7 428.1 181.6 416.8 174.4 404.6 C 167.2 392.5 162.2 374.3 161.3 361.1 C 160.5 348.0 165.6 338.0 169.5 325.8 C 173.4 313.5 186.1 300.4 184.7 287.7 C 183.4 275.0 164.4 261.0 161.3 249.6 C 158.3 238.2 162.2 230.8 166.2 219.1 C 170.3 207.4 178.8 182.1 185.8 179.4 C 192.9 176.8 202.4 203.5 208.4 203.4 C 214.4 203.3 214.1 185.2 222.0 178.9 C 229.9 172.5 253.7 167.1 256.0 165.3 C 258.3 163.5 232.2 167.5 235.6 168.0 C 239.0 168.5 264.4 162.6 276.4 168.0 Z"/>
    <clipPath id="body-clip"><use href="#body"/></clipPath>
  </defs>

  <!-- cream field, warm stone -->
  <rect x="4" y="4" width="504" height="504" rx="116" fill="#F6EEDB"/>

  <!-- horseshoe arch, offset screenprint shadow first -->
  <path d="M 128 464 L 128 302 A 140 140 0 0 1 408 302 L 408 464 Z" fill="#6E3B2A"/>
  <path d="M 116 452 L 116 290 A 140 140 0 0 1 396 290 L 396 452 Z" fill="#C2603E"/>
  <!-- carved inner frame line -->
  <path d="M 128 452 L 128 290 A 128 128 0 0 1 384 290 L 384 452 Z"
        fill="none" stroke="#F6EEDB" stroke-width="3" opacity="0.55"/>

  <!-- the body, leaning lightly on its hook -->
  <g transform="rotate(-4 256 300)">
    <g clip-path="url(#body-clip)">
      <!-- body -->
      <use href="#body" fill="#C2603E" stroke="#3A2418" stroke-width="4" stroke-linejoin="round"/>
      <!-- three single coils — the Beldi glass rims -->
      <g fill="#F6EEDB" stroke="#3A2418" stroke-width="3.5">
        <rect x="212" y="262" width="88" height="21" rx="10.5"/>
        <rect x="212" y="292" width="88" height="21" rx="10.5"/>
        <rect x="212" y="322" width="88" height="21" rx="10.5"/>
      </g>
      <!-- six strings over the rims, into the doorway's pocket -->
      <g stroke="#F6EEDB" stroke-width="2.5" opacity="0.9" stroke-linecap="round">
        <line x1="229" y1="396" x2="236" y2="176"/>
        <line x1="241" y1="396" x2="244" y2="175"/>
        <line x1="253" y1="396" x2="251" y2="174"/>
        <line x1="265" y1="396" x2="259" y2="174"/>
        <line x1="277" y1="396" x2="267" y2="175"/>
        <line x1="289" y1="396" x2="275" y2="176"/>
      </g>
      <!-- bridge -->
      <rect x="202" y="388" width="108" height="21" rx="9" fill="#6E3B2A" transform="rotate(-2 256 398)"/>
      <!-- six strings over the rims, into the doorway's pocket -->
      <g stroke="#F6EEDB" stroke-width="2.5" opacity="0.9" stroke-linecap="round">
      </g>
      <!-- the nut fence: the instrument passes through the door -->
      <rect x="232" y="165" width="48" height="13" rx="5.5" fill="#F6EEDB" stroke="#3A2418" stroke-width="3"/>
    </g>
    <!-- the seed bubble — every mouth-blown Beldi glass has one -->
    <circle cx="215" cy="237" r="6" fill="#F6EEDB" opacity="0.8"/>
  </g>
</svg>
