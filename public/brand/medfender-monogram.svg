      <stop offset="55%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>
    <linearGradient id="liquid-cobalt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B4DE4"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <linearGradient id="liquid-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B2FBE"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#4C8DFF"/>
    </linearGradient>
    <linearGradient id="royal-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="55%" stop-color="#7B2FBE"/>
      <stop offset="100%" stop-color="#3B1D6E"/>
    </linearGradient>
    <linearGradient id="purple-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <linearGradient id="cobalt-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C8DFF"/>
      <stop offset="60%" stop-color="#1B4DE4"/>
      <stop offset="100%" stop-color="#0E2A7A"/>
    </linearGradient>
    <linearGradient id="cobalt-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C8DFF"/>
      <stop offset="100%" stop-color="#1B4DE4"/>
    </linearGradient>
    <linearGradient id="cobalt-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B4DE4"/>
      <stop offset="100%" stop-color="#0E2A7A"/>
    </linearGradient>
    <radialGradient id="crimson-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E4515A"/>
      <stop offset="45%" stop-color="#9B2226"/>
      <stop offset="100%" stop-color="#4A0E14"/>
    </radialGradient>
    <!-- The glaze is radial, not directional: the last stop is reached at
         r=50%, so every edge of a repeating tile carries an identical value
         and the sheet tiles seamlessly. Directional lighting belongs to the
         page plane, not to a repeating cell. -->
    <radialGradient id="glaze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2F6FC" stop-opacity="0.42"/>
      <stop offset="52%" stop-color="#F2F6FC" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0A0F1E" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="arris" x1="0" y1="0" x2="0.72" y2="1">
      <stop offset="0%" stop-color="#E6ECF8" stop-opacity="0.9"/>
      <stop offset="38%" stop-color="#E6ECF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E6ECF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="night-wash" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E1630" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#05070D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AFC3E2"/>
      <stop offset="45%" stop-color="#5A6C94"/>
      <stop offset="100%" stop-color="#22314F"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6ECF8"/>
      <stop offset="45%" stop-color="#8FA6CC"/>
      <stop offset="100%" stop-color="#33456B"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8FA6CC" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <filter id="grain" x="0" y="0" width="512.00" height="512.00" filterUnits="userSpaceOnUse">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" seed="5" stitchTiles="stitch" result="t"/>
    <feColorMatrix in="t" type="matrix" result="m"
      values="0.33 0.33 0.33 0 0
              0.33 0.33 0.33 0 0
              0.33 0.33 0.33 0 0
              0    0    0    0 0.09"/>
  </filter>
