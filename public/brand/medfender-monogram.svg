<svg xmlns="http://www.w3.org/2000/svg" width="512.00" height="512.00" viewBox="0 0 512.00 512.00">

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A3A63"/>
      <stop offset="22%" stop-color="#A9B7D3"/>
      <stop offset="46%" stop-color="#E6ECF8"/>
      <stop offset="68%" stop-color="#A9B7D3"/>
      <stop offset="100%" stop-color="#2A3A63"/>
    </linearGradient>
    <linearGradient id="gold-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6ECF8"/>
      <stop offset="100%" stop-color="#A9B7D3"/>
    </linearGradient>
    <radialGradient id="obsidian-field" cx="50%" cy="42%" r="72%">
