            - generic [ref=e159]: "01"
            - heading "The Setup" [level=3] [ref=e162]
            - paragraph [ref=e163]: Integrating the organic feel of analog gear with the precision of digital processors. Every preset begins with a real signal chain — genuine tube preamps, real outboard, physical cab IRs — then distilled into a HX Stomp or TONEX capture that feels indistinguishable from the source.
          - img "The Setup" [ref=e166]
        - generic [ref=e168]:
          - generic [ref=e169]:
            - generic [ref=e170]: "02"
            - heading "The Tone" [level=3] [ref=e173]
            - paragraph [ref=e174]: Blues, rock, fusion, and Gnawa fusion architecture. We build for how a guitarist actually plays — not how a chart measures. Touch sensitivity, note bloom, harmonic feedback at stage volume. Tone that responds to your hands, not just your fingers.
          - img "The Tone" [ref=e177]
        - generic [ref=e179]:
          - generic [ref=e180]:
            - generic [ref=e181]: "03"
            - heading "The Craft" [level=3] [ref=e184]
            - paragraph [ref=e185]: Precision audio engineering backed by stem separation, multi-band analysis, and gain-staging at 96kHz / 24-bit. Every impulse response and capture is verified against the original before release. We don't ship until the comparison is airtight.
          - img "The Craft" [ref=e188]
        - generic [ref=e190]:
          - generic [ref=e191]:
            - generic [ref=e192]: "04"
            - heading "The Stage" [level=3] [ref=e195]
            - paragraph [ref=e196]: Translating studio-grade tone to the live environment. Whether it is an intimate solo arrangement or a high-energy Gnawa fusion trio, the digital architecture is built to cut through the mix, adapt to any venue, and command the room.
          - img "The Stage" [ref=e199]
