            - generic [ref=e202]: "04"
            - heading "The Stage" [level=3] [ref=e205]
            - paragraph [ref=e206]: Translating studio-grade tone to the live environment. Whether it is an intimate solo arrangement or a high-energy Gnawa fusion trio, the digital architecture is built to cut through the mix, adapt to any venue, and command the room.
          - img "The Stage" [ref=e209]
