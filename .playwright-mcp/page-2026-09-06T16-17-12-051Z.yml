            - generic [ref=e169]: "01"
            - heading "The Setup" [level=3] [ref=e172]
            - paragraph [ref=e173]: Integrating the organic feel of analog gear with the precision of digital processors. Every preset begins with a real signal chain — genuine tube preamps, real outboard, physical cab IRs — then distilled into a HX Stomp or TONEX capture that feels indistinguishable from the source.
          - img "The Setup" [ref=e176]
        - generic [ref=e178]:
          - generic [ref=e179]:
            - generic [ref=e180]: "02"
            - heading "The Tone" [level=3] [ref=e183]
            - paragraph [ref=e184]: Blues, rock, fusion, and Gnawa fusion architecture. We build for how a guitarist actually plays — not how a chart measures. Touch sensitivity, note bloom, harmonic feedback at stage volume. Tone that responds to your hands, not just your fingers.
          - img "The Tone" [ref=e187]
        - generic [ref=e189]:
          - generic [ref=e190]:
            - generic [ref=e191]: "03"
            - heading "The Craft" [level=3] [ref=e194]
            - paragraph [ref=e195]: Precision audio engineering backed by stem separation, multi-band analysis, and gain-staging at 96kHz / 24-bit. Every impulse response and capture is verified against the original before release. We don't ship until the comparison is airtight.
          - img "The Craft" [ref=e198]
        - generic [ref=e200]:
