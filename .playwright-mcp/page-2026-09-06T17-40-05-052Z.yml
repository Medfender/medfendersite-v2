      - generic [ref=f2e166]:
        - generic [ref=f2e167]:
          - generic [ref=f2e168]:
            - generic [ref=f2e169]: "01"
            - heading "The Setup" [level=3] [ref=f2e172]
            - paragraph [ref=f2e173]: Integrating the organic feel of analog gear with the precision of digital processors. Every preset begins with a real signal chain — genuine tube preamps, real outboard, physical cab IRs — then distilled into a HX Stomp or TONEX capture that feels indistinguishable from the source.
          - img "The Setup" [ref=f2e176]
        - generic [ref=f2e178]:
          - generic [ref=f2e179]:
            - generic [ref=f2e180]: "02"
            - heading "The Tone" [level=3] [ref=f2e183]
            - paragraph [ref=f2e184]: Blues, rock, fusion, and Gnawa fusion architecture. We build for how a guitarist actually plays — not how a chart measures. Touch sensitivity, note bloom, harmonic feedback at stage volume. Tone that responds to your hands, not just your fingers.
          - img "The Tone" [ref=f2e187]
        - generic [ref=f2e189]:
          - generic [ref=f2e190]:
            - generic [ref=f2e191]: "03"
            - heading "The Craft" [level=3] [ref=f2e194]
            - paragraph [ref=f2e195]: Precision audio engineering backed by stem separation, multi-band analysis, and gain-staging at 96kHz / 24-bit. Every impulse response and capture is verified against the original before release. We don't ship until the comparison is airtight.
          - img "The Craft" [ref=f2e198]
        - generic [ref=f2e200]:
          - generic [ref=f2e201]:
            - generic [ref=f2e202]: "04"
            - heading "The Stage" [level=3] [ref=f2e205]
            - paragraph [ref=f2e206]: Translating studio-grade tone to the live environment. Whether it is an intimate solo arrangement or a high-energy Gnawa fusion trio, the digital architecture is built to cut through the mix, adapt to any venue, and command the room.
          - img "The Stage" [ref=f2e209]
